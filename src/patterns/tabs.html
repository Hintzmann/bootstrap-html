<pe-tabs data-pe="tabs">
  <div role="tablist" aria-label="Account">
    <button type="button" role="tab" id="pe-tab-profile" aria-controls="pe-panel-profile" aria-selected="true">Profile</button>
    <button type="button" role="tab" id="pe-tab-security" aria-controls="pe-panel-security" aria-selected="false" tabindex="-1">Security</button>
    <button type="button" role="tab" id="pe-tab-billing" aria-controls="pe-panel-billing" aria-selected="false" tabindex="-1">Billing</button>
  </div>
  <div role="tabpanel" id="pe-panel-profile" aria-labelledby="pe-tab-profile" tabindex="0">
    <p>Name, photo, and language.</p>
  </div>
  <div role="tabpanel" id="pe-panel-security" aria-labelledby="pe-tab-security" tabindex="0" hidden="until-found">
    <p>Password and two-factor sign-in.</p>
  </div>
  <div role="tabpanel" id="pe-panel-billing" aria-labelledby="pe-tab-billing" tabindex="0" hidden="until-found">
    <p>Invoices and payment method.</p>
  </div>
</pe-tabs>
