<button type="button" command="show-popover" commandfor="pe-toast">Save settings</button>

<pe-toast data-pe="toasts" id="pe-toast" popover="manual" role="status" aria-live="polite" aria-atomic="true" data-delay="5000">
  <p>Settings saved.</p>
  <button type="button" command="hide-popover" commandfor="pe-toast" aria-label="Close">×</button>
</pe-toast>
