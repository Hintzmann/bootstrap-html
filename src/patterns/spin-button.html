<label for="pe-qty">Quantity</label>
<div data-pe="spin-button">
  <button type="button" command="--step-down" commandfor="pe-qty" aria-label="Decrease quantity" tabindex="-1">−</button>
  <input type="number" id="pe-qty" name="qty" value="1" min="1" max="8">
  <button type="button" command="--step-up" commandfor="pe-qty" aria-label="Increase quantity" tabindex="-1">+</button>
  <output for="pe-qty"></output>
</div>
