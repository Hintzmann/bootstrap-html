<button type="button" command="show-modal" commandfor="pe-modal">Delete file</button>

<dialog data-pe="modal" id="pe-modal" closedby="any" aria-labelledby="pe-modal-title">
  <form method="dialog">
    <h2 id="pe-modal-title">Delete the file?</h2>
    <p>This cannot be undone.</p>
    <button value="cancel">Cancel</button>
    <button value="delete">Delete</button>
  </form>
</dialog>
