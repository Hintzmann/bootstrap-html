<fieldset data-pe="range-group">
  <legend>Price</legend>
  <label for="pe-price-min">Minimum price</label>
  <label for="pe-price-max">Maximum price</label>
  <div>
    <input type="range" id="pe-price-min" name="price-min" min="0" max="1000" step="10" value="200">
    <input type="range" id="pe-price-max" name="price-max" min="0" max="1000" step="10" value="800">
  </div>
  <p><output for="pe-price-min" aria-live="off">200</output> – <output for="pe-price-max" aria-live="off">800</output></p>
</fieldset>
