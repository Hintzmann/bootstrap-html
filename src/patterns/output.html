<fieldset data-pe="output">
  <legend>
    Notify me
    <output id="pe-notify-count" data-controls="pe-notify-options" for="pe-notify-email pe-notify-sms">1<span> selected</span></output>
  </legend>
  <div id="pe-notify-options">
    <label><input type="checkbox" id="pe-notify-email" name="notify" value="email" checked> Email</label>
    <label><input type="checkbox" id="pe-notify-sms" name="notify" value="sms"> SMS</label>
  </div>
</fieldset>
